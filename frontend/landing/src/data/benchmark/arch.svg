<svg class="chart arch" viewBox="0 0 650 300" role="img" aria-label="How a request moves through OpenScience"><defs><marker id="arch-a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-a" d="M0 0L8 4L0 8z"/></marker><marker id="arch-g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk-g" d="M0 0L8 4L0 8z"/></marker></defs><rect class="box" x="175" y="10" width="190" height="46" rx="4"/><text class="ink" x="270" y="29" text-anchor="middle">skills</text><text class="item" x="270" y="45" text-anchor="middle">371 in 18 categories, loaded on demand</text><line class="ln dash" x1="270" y1="56" x2="270" y2="92" marker-end="url(#arch-g)"/><rect class="box" x="8" y="106" width="94" height="36" rx="4"/><text class="ink" x="55" y="128" text-anchor="middle">your goal</text><line class="ln acc flow" x1="102" y1="124" x2="175" y2="124" marker-end="url(#arch-a)"/><rect class="box lead" x="175" y="94" width="190" height="60" rx="4"/><text class="ink" x="270" y="119" text-anchor="middle">research agent</text><text class="item" x="270" y="136" text-anchor="middle">lead: plans, delegates, synthesises</text><rect class="box" x="410" y="10" width="130" height="84" rx="4"/><text class="ink" x="422" y="28">tools</text><text class="item" x="422" y="45">shell</text><text class="item" x="422" y="59">Python and R kernels</text><text class="item" x="422" y="73">files</text><text class="item" x="422" y="87">literature, 42 databases</text><rect class="box" x="410" y="162" width="130" height="70" rx="4"/><text class="ink" x="422" y="180">compute</text><text class="item" x="422" y="197">local machine</text><text class="item" x="422" y="211">SSH, Slurm, PBS</text><text class="item" x="422" y="225">Modal</text><path class="ln" d="M365 108H388V52H410" marker-end="url(#arch-g)"/><path class="ln" d="M365 140H388V197H410" marker-end="url(#arch-g)"/><line class="ln acc flow" x1="